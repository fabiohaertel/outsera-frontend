<app-panel title="List years with multiple winners">
  <app-resource-state [resource]="years" />
  @if (years.hasValue()) {
    <div class="table-responsive">
      <table class="table table-sm table-bordered table-striped mb-0">
        <thead>
          <tr>
            <th scope="col">Year</th>
            <th scope="col">Win Count</th>
          </tr>
        </thead>
        <tbody>
          @for (item of years.value(); track item.year) {
            <tr>
              <td>{{ item.year }}</td>
              <td>{{ item.winnerCount }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="text-center text-body-secondary">No years found</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</app-panel>
