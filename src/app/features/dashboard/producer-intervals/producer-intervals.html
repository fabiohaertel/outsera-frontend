<app-panel title="Producers with longest and shortest interval between wins">
  <app-resource-state [resource]="intervals" />
  @for (section of sections(); track section.title) {
    <h3 class="h6 fw-normal mt-3">{{ section.title }}</h3>
    <div class="table-responsive">
      <table class="table table-sm table-bordered table-striped mb-0">
        <thead>
          <tr>
            <th scope="col">Producer</th>
            <th scope="col">Interval</th>
            <th scope="col">Previous Year</th>
            <th scope="col">Following Year</th>
          </tr>
        </thead>
        <tbody>
          <!-- Ties are expected: the same producer may appear more than once. -->
          @for (row of section.rows; track $index) {
            <tr>
              <td>{{ row.producer }}</td>
              <td>{{ row.interval }}</td>
              <td>{{ row.previousWin }}</td>
              <td>{{ row.followingWin }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center text-body-secondary">No producers found</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</app-panel>
