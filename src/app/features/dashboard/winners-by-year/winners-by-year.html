<app-panel title="List movie winners by year">
  <form class="mb-3" novalidate (submit)="search($event)">
    <div class="input-group input-group-sm has-validation">
      <input
        type="number"
        class="form-control"
        placeholder="Search by year"
        aria-label="Search by year"
        [formControl]="yearControl"
        [class.is-invalid]="yearControl.invalid && yearControl.touched"
      />
      <button type="submit" class="btn btn-primary" aria-label="Search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.414zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
          />
        </svg>
      </button>
      <div class="invalid-feedback">Enter a valid year, e.g. 1990.</div>
    </div>
  </form>

  <app-resource-state [resource]="winners" />
  @if (winners.hasValue()) {
    <div class="table-responsive">
      <table class="table table-sm table-bordered table-striped mb-0">
        <thead>
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Year</th>
            <th scope="col">Title</th>
          </tr>
        </thead>
        <tbody>
          @for (movie of winners.value(); track movie.id) {
            <tr>
              <td>{{ movie.id }}</td>
              <td>{{ movie.year }}</td>
              <td>{{ movie.title }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="text-center text-body-secondary">No winners found</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</app-panel>
