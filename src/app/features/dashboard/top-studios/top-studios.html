<app-panel title="Top 3 studios with winners">
  <app-resource-state [resource]="studios" />
  @if (studios.hasValue()) {
    <div class="table-responsive">
      <table class="table table-sm table-bordered table-striped mb-0">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Win Count</th>
          </tr>
        </thead>
        <tbody>
          @for (studio of studios.value(); track studio.name) {
            <tr>
              <td>{{ studio.name }}</td>
              <td>{{ studio.winCount }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="text-center text-body-secondary">No studios found</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</app-panel>
